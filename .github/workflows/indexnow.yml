# Tell IndexNow search engines (Bing → Copilot/ChatGPT search, Yandex, Seznam, Naver) about every URL
# after each production deploy. Google does not use IndexNow; it reads the sitemap in Search Console.
name: Post-deploy SEO check + IndexNow ping

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the Vercel production deploy
        run: sleep 120
      - name: Check the live site is open to search engines
        env:
          HOST: vailvalleyit.com
        run: |
          set -euo pipefail
          echo "--- robots.txt as served to Googlebot"
          robots=$(curl -fsSL -A 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' "https://$HOST/robots.txt")
          echo "$robots"
          meta=$(curl -fsSL "https://$HOST/managed-it-services" | grep -oE '<meta name="robots" content="[^"]*"' || true)
          echo "--- /managed-it-services: $meta"
          for u in / /sitemap.xml /sitemap-index.xml /managed-it-services; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code}' -A 'Googlebot/2.1' "https://$HOST$u")"
          done
          if echo "$robots" | grep -qx 'Disallow: /'; then echo "::error::robots.txt blocks all crawlers"; exit 1; fi
          if echo "$meta" | grep -q noindex; then echo "::error::pages are noindex"; exit 1; fi
      - name: Submit sitemap URLs
        env:
          HOST: vailvalleyit.com
          KEY: 238ee261fa58eda40fa48b2649ca8eda
        run: |
          set -euo pipefail
          urls=$(for sm in $(curl -fsSL "https://$HOST/sitemap-index.xml" | grep -oE '<loc>[^<]+' | sed 's/<loc>//'); do
            curl -fsSL "$sm" | grep -oE '<loc>[^<]+' | sed 's/<loc>//'
          done | sort -u)
          count=$(echo "$urls" | wc -l)
          echo "Submitting $count URLs"
          body=$(jq -n --arg host "$HOST" --arg key "$KEY" --arg loc "https://$HOST/$KEY.txt" \
            --argjson list "$(echo "$urls" | jq -R . | jq -s .)" '{host:$host,key:$key,keyLocation:$loc,urlList:$list}')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow responded $code"
          case "$code" in 200|202) ;; *) exit 1 ;; esac
